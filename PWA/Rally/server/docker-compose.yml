# Start with:  RALLY_HOST=192.168.1.50 docker compose up -d --build
# (use this machine's LAN IP address so it's in the TLS certificate and on the setup page)
services:
  rally:
    build: .
    image: rally-server
    container_name: rally-server
    restart: unless-stopped
    ports:
      - "${RALLY_PORT:-8444}:8444"
    environment:
      # LAN address devices use to reach this machine. Leave empty to use whatever
      # address a device opened the setup page with.
      ADVERTISED_HOST: "${RALLY_HOST:-}"
      ADVERTISED_PORT: "${RALLY_PORT:-8444}"
      # Where the Rally game is hosted.
      GAME_URL: "${RALLY_GAME_URL:-https://tjansuy.github.io/testing-Claude/PWA/Rally/}"
    volumes:
      - certs:/certs
    read_only: true
    tmpfs:
      - /tmp

volumes:
  certs:
