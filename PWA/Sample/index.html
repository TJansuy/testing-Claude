<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World PWA</title>
  <meta name="description" content="A minimal Hello World Progressive Web App.">
  <meta name="theme-color" content="#3f51b5">
  <!-- All paths are relative so the app works from file://, localhost, or a GitHub Pages sub-path. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <img src="icons/icon.svg" alt="" width="96" height="96">
    <h1>Hello, World!</h1>
    <p>This is a minimal Progressive Web App.</p>

    <ul class="status">
      <li>Protocol: <strong id="protocol">…</strong></li>
      <li>Service worker: <strong id="sw-status">…</strong></li>
      <li>Network: <strong id="net-status">…</strong></li>
    </ul>

    <button id="install" hidden>Install app</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
