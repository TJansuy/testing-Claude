# SteamCast settings: ~/.config/steamcast/steamcast.ini
[steamcast]
# Name shown in Cast / AirPlay / DLNA pickers. Default: "SteamCast (<hostname>)".
# name = Living Room TV

# Which receivers to run.
youtube = yes
dlna = yes
googlecast = yes
airplay = yes

# Phone remote page and DLNA description: http://<this machine>:8090/
http_port = 8090

# --- Surround sound ---------------------------------------------------------
# auto   = open the HDMI output with every channel it offers (5.1 / 7.1 PCM)
# 5.1 / 7.1 / stereo = force a layout (mpv up/downmixes as needed)
audio_channels = auto
# Send these codecs untouched to an AV receiver / soundbar (bitstream):
# passthrough = ac3,eac3,dts-hd,truehd
passthrough =
# A specific output, as listed by: mpv --audio-device=help
# audio_device = pipewire/alsa_output.pci-0000_04_00.1.hdmi-surround71

# --- Video smoothness -------------------------------------------------------
# Hardware decoding through VA-API. "no" forces software decoding.
hwdec = auto-safe
# Time frames to the TV's refresh rate and blend frames, so 24 fps film
# doesn't judder on a 60 Hz TV. (Off automatically while passthrough is set.)
smooth_motion = yes
# "fast" lowers scaling quality to save GPU time (try it for 4K output).
video_profile = default
# MB of network stream to read ahead. More = fewer stalls on slow Wi-Fi.
cache_mb = 400

# --- YouTube ----------------------------------------------------------------
# DIAL port the YouTube app connects to.
youtube_port = 8091
# Stream choice for YouTube (yt-dlp format). The default caps at 1080p60 and
# avoids AV1, which the Steam Deck can't decode in hardware. For a 4K TV:
# youtube_format = bestvideo[height<=?2160][fps<=?60][vcodec!^=av01]+bestaudio/best
youtube_format = bestvideo[height<=?1080][fps<=?60][vcodec!^=av01]+bestaudio/best[height<=?1080]

# --- Advanced ---------------------------------------------------------------
fullscreen = yes
# mdns = auto | builtin | avahi
mdns = auto
# Extra mpv options, e.g. --vo=gpu-next
mpv_args =
# Override player / AirPlay commands (default: auto-detected)
# mpv_command = flatpak run io.mpv.Mpv
# uxplay_command = distrobox enter steamcast-airplay -- uxplay
# node_command = node
# ytdlp_command = yt-dlp
uxplay_args = -fs
